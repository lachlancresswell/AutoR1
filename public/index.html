<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoR1 2.0 Beta</title>
    <script defer src="bundle.js"></script>
    <link rel="stylesheet" href="output.css">
</head>

<body
    class="h-full font-mono bg-white dark:bg-zinc-800 text-zinc-800 dark:text-zinc-50 flex flex-col justify-center select-none">
    <div x-data="app" x-ref="app" class="mx-auto max-w-96 flex flex-col items-center " x-init="init()">
        <div class="w-max flex flex-col items-center my-5">
            <h1 class="text-4xl font-bold">AutoR1 2.0 Beta</h1>
        </div>
        <div class="w-max flex flex-col items-center">
            <div x-show="!projectFile" class="relative">
                <input class="absolute inset-0 z-50 m-0 p-1 w-full h-full outline-none opacity-0 cursor-pointer"
                    type="file" id="fileInput" accept=".dbpr" qx-show="!projectFile"
                    @change="files = $event.target.files;handleDrop($event);"
                    @dragover="$refs.dragnDrop.classList.remove('border-slate-700');$refs.dragnDrop.classList.add('border-slate-400');"
                    @dragleave="$refs.dragnDrop.classList.remove('border-slate-400');$refs.dragnDrop.classList.add('border-slate-700');"
                    @drop="$refs.dragnDrop.classList.remove('border-slate-400');$refs.dragnDrop.classList.add('border-slate-700');" />
                <div x-ref="dragnDrop" class="h-48 flex items-center justify-center cursor-pointer border-solid border-2
                     border-slate-700 hover:border-slate-400" onclick="document.getElementById('fileInput').click();">
                    <div>Click to load a .DBPR file or drag and drop.</div>
                </div>
            </div>
        </div>

        <template x-if="projectFile && sourceGroupsStatus">
            <div class="w-full">
                <div>
                    <div class="text-center font-bold mb-1" x-text="fileName">
                    </div>
                    <p>Initial setup performed: ✅</p>
                    <p x-show="projectFile.additions">Already contains AutoR1 additions: <span>✅</span></p>
                </div>
                <div class="w-full">
                    <div class="text-lg my-2 flex justify-around gap-x-2 h-8">
                        <button class="rounded-md bg-lime-600 basis-1/2" @click="processFile()"><span
                                class="mr-1">▶️</span><span>Run</span></button>
                    </div>
                    <div class="text-lg my-2 flex justify-around gap-x-2 h-8">
                        <button class="rounded-md basis-1/4 bg-zinc-600" x-show="projectFile.additions"
                            @click="cleanFile()"
                            title="Remove all AutoR1 additions and return the project to its initial state.">
                            <span class="mr-1">🧹</span><span>Clean</span>
                        </button>
                        <button class="rounded-md basis-1/4 bg-zinc-600" @click="clearFile()"
                            title="Unload the current file.">
                            <span class="mr-1">⏮️</span><span>Clear</span>
                        </button>
                        <button class="rounded-md basis-1/4 bg-zinc-600" x-bind:disabled="!statusHasChanged()"
                            x-bind:style="(!statusHasChanged()) && { opacity: '50%' }" @click="resetStatus()"
                            title="Reset configuration options.">
                            <span class="mr-1">⏪</span><span>Reset</span>
                        </button>
                        <button class="rounded-md basis-1/4 bg-zinc-600" @click="toggleVisibility()"
                            title="Toggle configuration display.">
                            <span class="mr-1" x-text="isVisible ? '⤴️' : '⤵️'"></span>
                            <span x-text="isVisible ? 'Hide' : 'Show'"></span>
                        </button>
                    </div>
                    <div class="flex flex-col items-center" x-show="isVisible">
                        <div class="w-full">
                            <div class="flex justify-end" title="Toggle whether the Main page is created.">
                                <div class="w-fit basis-2/3">Main page</div>
                                <input class="basis-1/3" type="checkbox" x-model="projectOptions.main" />
                            </div>
                            <div class="flex justify-end" title="Toggle whether the Meter page is created.">
                                <div class="w-fit basis-2/3">Meter page</div>
                                <input class="basis-1/3" type="checkbox" x-model="projectOptions.meter" />
                            </div>
                            <div class="flex justify-end" title="Toggle whether the EQ page is created.">
                                <div class="w-fit basis-2/3">EQ page</div>
                                <input class="basis-1/3" type="checkbox" x-model="projectOptions.eq" />
                            </div>
                            <div x-ref="asControls" class="flex justify-end"
                                title="Toggle whether the per-source ArraySight controls are created.">
                                <div class="w-fit basis-2/3">ArraySight controls</div>
                                <input class="basis-1/3" type="checkbox" x-model="projectOptions.arraySightControls" />
                            </div>
                            <div class="flex justify-end"
                                title="Toggle whether Main page gain settings target the analog or digital inputs.">
                                <div class="w-fit basis-2/3">Input gain</div>
                                <div class="basis-1/3">
                                    <input id="inputGainTypeAnalog" value=0 type="radio" type="number"
                                        x-model="projectOptions.inputGainType"><label class="cursor-pointer"
                                        for="inputGainTypeAnalog">Analog</label>
                                </div>
                                <div class="basis-1/3">
                                    <input id="inputGainTypeDigital" value=1 type="radio" type="number"
                                        x-model="projectOptions.inputGainType"><label class="cursor-pointer"
                                        for="inputGainTypeDigital">Digital</label>
                                </div>
                            </div>
                            <div class="flex justify-between gap-1" title="Load a custom .r2t template file.">
                                <div class="w-fit basis-1/2">Custom templates:</div>
                                <input type="file" id="templateInput" class="hidden" accept=".r2t"
                                    @change="tf = $event.target.tf;handleTemplateFileDrop($event);" />
                                <div x-show="!customTemplateFileName"
                                    class="rounded-md basis-1/4 w-full bg-zinc-600 text-center cursor-pointer"
                                    onclick="document.getElementById('templateInput').click();">
                                    Load
                                </div>
                                <div x-show="!customTemplateFileName"
                                    class="rounded-md basis-1/4 w-full bg-zinc-600 text-center cursor-pointer"
                                    @click="downloadTemplateFile();">
                                    Get
                                </div>
                                <div x-show="customTemplateFileName"
                                    class="rounded-md basis-1/2 w-full bg-zinc-600 text-center cursor-pointer"
                                    @click="clearCustomTemplateFile();">
                                    <span class="text-xs" x-text="customTemplateFileName"></span>
                                    <span>❌</span>
                                </div>
                            </div>
                        </div>
                        <table id=" sourceGroupTable" class="text-center w-full">
                            <thead>
                                <tr>
                                    <th>Source Group</th>
                                    <th class="cursor-pointer" @click="toggleAllStatus('fallback')"
                                        title="Toggle whether a source is included in the generated fallback group.">
                                        Fallback</th>
                                    <th class="cursor-pointer" @click="toggleAllStatus('mute')"
                                        title="Toggle whether a source is included in the generated mute group.">
                                        Mute
                                    </th>
                                    <th class="cursor-pointer" @click="toggleAllStatus('ds')"
                                        title="Toggle whether a source is included in the generated DS data group.">
                                        DS
                                        Data</th>
                                    <th class="cursor-pointer" @click="toggleAllStatus('eq')"
                                        title="Toggle whether a source is included in the generated EQ group.">
                                        EQ</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="(row, index) in sourceGroupsStatus">
                                    <tr>
                                        <td class="cursor-pointer" @click="toggleRowStatus(index)">
                                            <!-- Quick fix for something in the render order here causing projectFile.sourceGroups[index] to be evaluated despite projectFile being undefined and in the x-if above -->
                                            <span
                                                x-text="projectFile && projectFile.sourceGroups && projectFile.sourceGroups[index] && projectFile.sourceGroups[index].Name"></span>
                                        </td>
                                        <td><input type="checkbox" x-model="row.fallback" /></td>
                                        <td><input type="checkbox" x-model="row.mute" /></td>
                                        <td><input type="checkbox" x-model="row.ds" /></td>
                                        <td><input type="checkbox" x-model="row.eq" /></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </template>

        <div class="text-sm text-center my-4">
            All files are processed on-device and are not uploaded or stored remotely. An internet connection is
            not
            required once
            the page has loaded.
        </div>
        <div style="height:3em;width:10em;">
            <a href=" https://www.buymeacoffee.com/Lachlanc"><img
                    src="https://img.buymeacoffee.com/button-api/?text=Buy me a coffee&emoji=&slug=Lachlanc&button_colour=FFDD00&font_colour=000000&font_family=Inter&outline_colour=000000&coffee_colour=ffffff" /></a>
        </div>
        <div class="w-1/3 space-y-3 flex flex-col items-center">
            <form action="https://www.paypal.com/donate" method="post" target="_top">
                <input type="hidden" name="hosted_button_id" value="RA2QUPH7AFK5J" />
                <input type="image" src="https://www.paypalobjects.com/en_AU/i/btn/btn_donate_LG.gif" name="submit"
                    title="PayPal - The safer, easier way to pay online!" alt="Donate with PayPal button" />
                <img alt="" src="https://www.paypal.com/en_AU/i/scr/pixel.gif" />
            </form>
        </div>
        <div style="font-size: 0.5em;">
            <span>Created by Lachlan Cresswell.</span>
            <span x-data="{ COMMIT: window.COMMIT }"></span>v<span x-text="window.VERSION"></span>-<span
                x-text="window.COMMIT"></span>

        </div>
        </div>
</body>

</html>
